services:
    db:
        image: 'postgis/postgis:12-3.3'
        container_name: api-boilerplate2.db
        ports:
            - 5438:5432
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=click123
            - POSTGRES_DB=postgres_db_fyp
        volumes:
            - 'api_postgres_data:/var/lib/postgresql'

    redis:
        image: 'bitnami/redis:6.0.16'
        container_name: api-boilerplate2.redis
        ports:
            - 6389:6379
        environment:
            - ALLOW_EMPTY_PASSWORD=yes
        volumes:
            - 'api_redis_data:/bitnami'

volumes:
    api_postgres_data:
        external: true
    api_redis_data:
        external: true
